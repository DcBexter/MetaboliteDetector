[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
md-core = { path = "crates/md-core" }
base64 = "0.23.1"
eframe = "0.37"
egui_extras = { version = "0.37", default-features = false }
egui_kittest = "0.37"
egui_plot = "0.38"
flate2 = "1.1.10"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
netcdf3 = "0.6"
png = "0.18"
rayon = "1.12.0"
regex = "1.13.1"
rfd = "0.17"
ron = "0.12"
semver = "1.0.28"
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "warn"

# Analysis speed matters more than build time for users.
[profile.release]
lto = "fat"
codegen-units = 1

# Keep debug builds usable on real chromatograms.
[profile.dev.package."*"]
opt-level = 3
