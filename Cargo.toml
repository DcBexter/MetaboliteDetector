[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Analysis speed matters more than build time for users.
[profile.release]
lto = "fat"
codegen-units = 1

# Keep debug builds usable on real chromatograms.
[profile.dev.package."*"]
opt-level = 3
