[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
md-core = { path = "crates/md-core" }
eframe = "0.37"
egui_extras = { version = "0.37", default-features = false }
egui_kittest = "0.37"
egui_plot = "0.38"
flate2 = "1.1.10"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
netcdf3 = "0.6"
png = "0.18"
rayon = "1.12.0"
regex = "1.13.1"
rfd = "0.17"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "warn"

# Analysis speed matters more than build time for users.
[profile.release]
lto = "fat"
codegen-units = 1

# Keep debug builds usable on real chromatograms.
[profile.dev.package."*"]
opt-level = 3
