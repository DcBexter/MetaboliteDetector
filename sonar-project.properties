# SonarQube Cloud CI analysis (Ubuntu job in .github/workflows/ci.yml). Automatic Analysis cannot analyze Rust.
sonar.organization=dcbexter
sonar.projectKey=DcBexter_MetaboliteDetector
sonar.sourceEncoding=UTF-8
# Every crate under crates/ is picked up: src/ is production code, tests/, examples/ and benches/ are test code.
sonar.sources=crates,docs/reverse-engineering/tools,example-data
sonar.tests=crates
# The C++ under docs/reverse-engineering/tools are LD_PRELOAD research shims into the old binary: not shipped, raw casts required.
sonar.exclusions=crates/*/tests/**,crates/*/examples/**,crates/*/benches/**,docs/reverse-engineering/tools/**/*.cpp
sonar.test.inclusions=crates/*/tests/**,crates/*/examples/**,crates/*/benches/**
# Reports written by the workflow: coverage from cargo llvm-cov, findings from Clippy.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippyReport.reportPaths=clippy-report.json
# md-app only draws (egui) and has no unit tests; analysis logic lives in md-core and is measured there.
sonar.coverage.exclusions=crates/md-app/**
