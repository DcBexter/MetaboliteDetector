name: Workflow Kit integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Workflow Kit integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node .vendor/workflow-kit/scripts/init-project.mjs . --existing
      - run: node .vendor/workflow-kit/scripts/setup-skills.mjs .
      - run: git add --intent-to-add --all && git diff --exit-code HEAD
