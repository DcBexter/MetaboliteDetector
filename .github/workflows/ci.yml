name: CI
on:
  # No paths filter: the required checks (CI, SonarCloud Code Analysis) must report on every PR,
  # and runs on main keep the shared cache warm and the Sonar main analysis current.
  push:
    branches: [main]
  pull_request:
    # Draft pushes run nothing; ready_for_review starts the run for the head that counts.
    # converted_to_draft starts a skipped run that cancels a running one through the concurrency group.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: Rust (${{ matrix.os }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The Sonar scan is skipped until the repo secret exists and Automatic Analysis is off (see CONTRIBUTING.md).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history for Sonar blame and new-code detection.
          fetch-depth: 0
          persist-credentials: false
      # Caches ~/.cargo and target. Only main saves, so PR caches cannot fill the 10 GB repo limit.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: runner.os != 'Linux'
      # One Clippy build serves both the gate and Sonar, which imports the JSON report but does not run Clippy.
      # Prints every warning and error, then fails like -D warnings if there was one or Clippy itself failed.
      - if: runner.os == 'Linux'
        run: |
          cargo clippy --workspace --all-targets --message-format=json > clippy-report.json && ok=1
          jq -r 'select(.reason == "compiler-message") | .message.rendered' clippy-report.json > clippy.txt
          cat clippy.txt
          [ -n "$ok" ] && [ ! -s clippy.txt ]
      # Example data is not fetched; its tests skip themselves.
      - run: cargo test --workspace
        if: runner.os != 'Linux'
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov
      # Runs the tests once, instrumented, for the Sonar coverage report.
      - if: runner.os == 'Linux'
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: runner.os == 'Linux' && env.SONAR_TOKEN != ''
  # The one required result for main: a fixed name, and it reports even when the matrix fails or is cancelled.
  ci:
    name: CI
    needs: check
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.check.result }}
