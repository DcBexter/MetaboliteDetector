# SonarQube Cloud automatic analysis. Switch to CI-based analysis once Rust coverage is reported.
sonar.sources=.
sonar.sourceEncoding=UTF-8
# Kit, vendored sources and generated provider skills/companions are not project code.
sonar.exclusions=.vendor/**,.agent/**,.agents/**,.claude/**,.codex/**,.cursor/**,.opencode/**,.pi/**,.github/skills/**,.github/agents/**,.github/hooks/**,target/**,Old/**
