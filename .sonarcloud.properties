# Only read by SonarQube Cloud Automatic Analysis, which skips Rust. Delete once the CI analysis
# in .github/workflows/sonar.yml runs; sonar-project.properties holds the real configuration.
sonar.sources=.
sonar.sourceEncoding=UTF-8
# Kit, vendored sources and generated provider skills/companions are not project code.
sonar.exclusions=.vendor/**,.agent/**,.agents/**,.claude/**,.codex/**,.cursor/**,.opencode/**,.pi/**,.github/skills/**,.github/agents/**,.github/hooks/**,target/**,Old/**
